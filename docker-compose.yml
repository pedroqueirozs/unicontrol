services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: unicontrol
      POSTGRES_PASSWORD: unicontrol
      POSTGRES_DB: unicontrol_dev
    ports:
      - "5432:5432"
    volumes:
      - unicontrol_dev_data:/var/lib/postgresql/data

volumes:
  unicontrol_dev_data:
